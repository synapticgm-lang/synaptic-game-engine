<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Original topographic grain">
  <!-- SynapticGM original dark topo grain — not from any game asset pack -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.16  0 0 0 0 0.14  0 0 0 0.4 0"/>
    </filter>
  </defs>
  <rect width="256" height="256" fill="#1a241c"/>
  <rect width="256" height="256" filter="url(#grain)" opacity="0.65"/>
  <path d="M0 80 Q64 60 128 84 T256 72" fill="none" stroke="#2a3a30" stroke-width="1.2" opacity="0.5"/>
  <path d="M0 140 Q80 120 160 148 T256 130" fill="none" stroke="#2a3a30" stroke-width="1" opacity="0.4"/>
  <path d="M0 200 Q70 180 140 204 T256 190" fill="none" stroke="#2a3a30" stroke-width="1" opacity="0.35"/>
</svg>
