<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Original parchment grain">
  <!-- SynapticGM original map grain — not from any game asset pack -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.34  0 0 0 0 0.22  0 0 0 0.35 0"/>
    </filter>
  </defs>
  <rect width="256" height="256" fill="#c9b896"/>
  <rect width="256" height="256" filter="url(#grain)" opacity="0.55"/>
  <circle cx="40" cy="60" r="48" fill="#b89f78" opacity="0.18"/>
  <circle cx="210" cy="190" r="64" fill="#a89068" opacity="0.14"/>
</svg>
