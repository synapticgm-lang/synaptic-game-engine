file: WOF_Engine_Schemas.yaml
packFormatVersion: 1
worldScope: WOF quarantined content library
ipFence: Original genre patterns only; no licensed names or live-service import.
engineDefaults:
  overworld: Tier 3 shared hubs with instanced combat
  partySize:
  - 2
  - 5
  raidSize: 10
  personalLoot: true
  midCombatFill: false
  wipe: checkpoint
  perCharacterWeeklyBossLockout: true
  wallets:
  - gold
  - cosmetic_tokens
  globalChatV1: false
  permadeathV1: false
  gacha: false
  lockoutSkips: false
  combatResolution: lockstep rounds; CODE commits state before prose
uniquenessRules:
- Every schema id is unique within its schema and namespaced as worldId:kind:slug
  where applicable.
- Locked Ash Compact identifiers are immutable and never reused.
- LootGrant idempotencyKey is unique per character, instance, reward event.
- ExpectedRevision rejects stale writes.
schemas:
  Account:
    description: WOF typed schema for Account; original content only, not production
      code.
    fields:
      id: &id001
        type: string
        required: true
        unique: true
        description: Stable WOF identifier; never reused for another object.
      version: &id002
        type: integer
        required: true
        default: 1
        minimum: 1
      createdAt:
        type: datetime
        required: true
        owner: CODE
      updatedAt: &id003
        type: string
        required: true
        format: iso8601
        owner: CODE
      accountId:
        type: string
        required: true
        owner: CODE
      emailHash:
        type: string
        required: true
        owner: CODE
        description: Hash only; no PII in telemetry
      ageBand:
        type: enum
        required: true
        owner: CODE
        allowed:
        - all_ages
        - teen
        - teen_plus
      worldIds:
        type: array[string]
        required: true
        owner: CODE
        default: []
    codeOwns:
    - validation
    - dice
    - HP
    - catalogs
    - quest ticks
    - loot
    - gold
    - lockouts
    - instance seeds
    - revisions
    llmMayNarrate:
    - committed state prose
    - diegetic descriptions
    - NPC dialogue without engine terms
    failureModes:
    - double-grant prevented by idempotency/revision checks
    - LLM invents gold or ownership rejected
    - desync rejected on stale ExpectedRevision
