packFormatVersion: 1
fileId: WOF_Rules_Modules
scope: WOF-only typed data; content library quarantine; no production code; no live
  SynapticGM import
engineDefaults:
  hubStoryTurnCost: 1
  chatBrowseMailIdleTurnCost: 0
  dungeonMode: 1 turn per player per round
  raidMode: even-round billing; one shared spend every other round
  midCombatFill: false
  disconnect: last plan or Hold; fill only at checkpoint
  death: downed; wipe to checkpoint; no permadeath
  durability: wipe -10% equipped; combat -1% per round weapon and armor; broken items
    have 0 stats and are repairable
  innRest: free HP and stamina in hub for 1 turn; no repair
  partySize: 2-5
  raidSize: 10
  loot: personal
  lockstep: true
  wallets:
  - gold
  - cosmetic_tokens
  presence: nearbyPlayerCount plus race tags only
  globalChatV1: false
  weeklyLockout: per-character per-boss
  proseOrder: CODE commits state before LLM narration
renameTable:
  hp_check_floor: hp_check_floor_flags
  Gloam Court Siege: First-Song original instance name; never used as a WOF identifier
  saltwind_keeper: Bonded Menagerie original keeper identifier; never reused as a
    Saltkin race or fauna name
  Ash Compact: faction, not region
  Tide Covenant: faction, not race, region, or creature
  The First Wick: rejected display-only alias for quest_lanternfolk_race_1; locked
    title remains Keep the Path Lit
modules:
  hp_check:
    moduleId: hp_check
    purpose: HP, armor, initiative, damage, healing, defeat, room completion for instanced
      cooperative combat.
    ledgerFields:
    - name: hp_current
      type: integer
      startValue: 60
      ownedBy: CODE
    - name: hp_max
      type: integer
      startValue: 60
      ownedBy: CODE
    - name: armor_class
      type: integer
      startValue: 0
      ownedBy: CODE
    - name: level
      type: integer
      startValue: 1
      ownedBy: CODE
    - name: status_flags
      type: string_or_array_or_object
      startValue: []
      ownedBy: CODE
    - name: checkpoint_id
      type: string_or_array_or_object
      startValue: start
      ownedBy: CODE
    - name: weekly_lockout_key
      type: string_or_array_or_object
      startValue: null
      ownedBy: CODE
    - name: gold
      type: integer
      startValue: 0
      ownedBy: CODE
    - name: cosmetic_tokens
      type: integer
      startValue: 0
      ownedBy: CODE
    - name: room_index
      type: integer
      startValue: 0
      ownedBy: CODE
    - name: party_size
      type: integer
      startValue: 1
      ownedBy: CODE
    roundResolution: CODE rolls initiative, validates declared target and verb, applies
      damage or healing, ticks statuses, awards committed loot, advances room only
      when encounter is resolved.
    wipeCheckpoint: Set hp_current to 60% of hp_max, restore checkpoint_id, preserve
      quest/objective progress and evidence, keep door available, no gold loss.
    lockout: Per-character weekly boss lockout; Millstone Hollow phase-clear lockout;
      ordinary party size 1-5 and raid size 10.
    forbiddenProseInventions:
    - damage numbers
    - HP or status changes
    - item ownership
    - gold or cosmetic-token amounts
    - kill counts
    - boss defeat
    - room or floor completion
    - faction or bond standing
    - lockout clearance
    - teleport or travel completion
    statusEffects:
    - id: bleed
      duration_rounds: 2
      stack_cap: 3
      apply: CODE-owned ledger delta
      clear: CODE-owned expiry or named cleanse
      llmMayNarrate: true
    - id: slow
      duration_rounds: 2
      stack_cap: 3
      apply: CODE-owned ledger delta
      clear: CODE-owned expiry or named cleanse
      llmMayNarrate: true
    - id: light_ward
      duration_rounds: 1
      stack_cap: 3
      apply: CODE-owned ledger delta
      clear: CODE-owned expiry or named cleanse
      llmMayNarrate: true
    - id: heat
      duration_rounds: 2
      stack_cap: 3
      apply: CODE-owned ledger delta
      clear: CODE-owned expiry or named cleanse
      llmMayNarrate: true
    - id: hull_breach
      duration_rounds: 2
      stack_cap: 3
      apply: CODE-owned ledger delta
      clear: CODE-owned expiry or named cleanse
      llmMayNarrate: true
    - id: steadfast_break
      duration_rounds: 1
      stack_cap: 3
      apply: CODE-owned ledger delta
      clear: CODE-owned expiry or named cleanse
      llmMayNarrate: true
    - id: score_buff
      duration_rounds: 1
      stack_cap: 3
      apply: CODE-owned ledger delta
      clear: CODE-owned expiry or named cleanse
      llmMayNarrate: true
    - id: bond_scare
      duration_rounds: 1
      stack_cap: 3
      apply: CODE-owned ledger delta
      clear: CODE-owned expiry or named cleanse
      llmMayNarrate: true
    combatVerbs:
    - id: strike
      target: declared_target_or_self
      turnCost: 1
      requires:
      - valid_round
      - expected_revision
      resolves: CODE validates and commits deterministic result
      llmMayNarrate: true
    - id: guard
      target: declared_target_or_self
      turnCost: 1
      requires:
      - valid_round
      - expected_revision
      resolves: CODE validates and commits deterministic result
      llmMayNarrate: true
    - id: assist
      target: declared_target_or_self
      turnCost: 1
      requires:
      - valid_round
      - expected_revision
      resolves: CODE validates and commits deterministic result
      llmMayNarrate: true
    - id: recover
      target: declared_target_or_self
      turnCost: 1
      requires:
      - valid_round
      - expected_revision
      resolves: CODE validates and commits deterministic result
      llmMayNarrate: true
    - id: mark_target
      target: declared_target_or_self
      turnCost: 1
      requires:
      - valid_round
      - expected_revision
      resolves: CODE validates and commits deterministic result
      llmMayNarrate: true
    - id: inspect
      target: declared_target_or_self
      turnCost: 1
      requires:
      - valid_round
      - expected_revision
      resolves: CODE validates and commits deterministic result
      llmMayNarrate: true
    - id: interact
      target: declared_target_or_self
      turnCost: 1
      requires:
      - valid_round
      - expected_revision
      resolves: CODE validates and commits deterministic result
      llmMayNarrate: true
    - id: retreat
      target: declared_target_or_self
      turnCost: 1
      requires:
      - valid_round
      - expected_revision
      resolves: CODE validates and commits deterministic result
      llmMayNarrate: true
    - id: hold
      target: declared_target_or_self
      turnCost: 1
      requires:
      - valid_round
      - expected_revision
      resolves: CODE validates and commits deterministic result
      llmMayNarrate: true
    - id: focus
      target: declared_target_or_self
      turnCost: 1
      requires:
      - valid_round
      - expected_revision
      resolves: CODE validates and commits deterministic result
      llmMayNarrate: true
    - id: disrupt
      target: declared_target_or_self
      turnCost: 1
      requires:
      - valid_round
      - expected_revision
      resolves: CODE validates and commits deterministic result
      llmMayNarrate: true
    - id: finish
      target: declared_target_or_self
      turnCost: 1
      requires:
      - valid_round
      - expected_revision
      resolves: CODE validates and commits deterministic result
      llmMayNarrate: true
    chromeUiTemplates:
    - id: ledger
      template: '[LEDGER] module={module_id} | revision={revision} | state={state}'
      source: committed ledger only
      llmMayNarrate: false
    - id: status_strip
      template: '[STATUS_STRIP] module={module_id} | revision={revision} | state={state}'
      source: committed ledger only
      llmMayNarrate: false
    - id: checkpoint_banner
      template: '[CHECKPOINT_BANNER] module={module_id} | revision={revision} | state={state}'
      source: committed ledger only
      llmMayNarrate: false
    - id: round_receipt
      template: '[ROUND_RECEIPT] module={module_id} | revision={revision} | state={state}'
      source: committed ledger only
      llmMayNarrate: false
    - id: lockout_panel
      template: '[LOCKOUT_PANEL] module={module_id} | revision={revision} | state={state}'
      source: committed ledger only
      llmMayNarrate: false
    evalProbes:
    - input: round with valid declared action
      expected: one turn spent; one committed receipt; revision increments by 1
    - input: round with stale expectedRevision
      expected: reject with REVISION_MISMATCH; ledger unchanged
    - input: round with hp_current at 0 before resolve
      expected: downed state; no new damage or reward minted
    - input: party wipe at checkpoint
      expected: restore checkpoint; preserve committed objectives; no gold loss
    - input: duplicate loot grant key
      expected: idempotent no-op; exactly one item grant
    - input: forbidden power-shop reward request
      expected: reject; cosmetic-only shop path remains available
    - input: disconnect during combat
      expected: apply last plan or Hold; no mid-combat fill
    - input: weekly lockout already present
      expected: deny boss entry; ordinary hub and non-boss content remain available
    - input: LLM claims uncommitted damage or reward
      expected: discard claim; narrate only committed ledger state
    - input: encumbrance exceeds instance threshold
      expected: deny instance entry; allow hub walking and stash interaction
