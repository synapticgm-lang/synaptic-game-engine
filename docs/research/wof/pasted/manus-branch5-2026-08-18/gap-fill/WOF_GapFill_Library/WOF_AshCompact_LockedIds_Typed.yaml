conversionOnly: true
originalIpFence: Original names and genre patterns only; no licensed settings or live
  import.
engineDefaults:
  partyMin: 2
  partyMax: 5
  raidSize: 10
  lockstepRounds: true
  hubStoryTurnCost: 1
  chatTurnCost: 0
  roundResolveSpendsTurn: true
  midCombatFill: false
  disconnect: follow_last_plan_or_hold
  death: downed; wipe_to_checkpoint; no_permadeath
