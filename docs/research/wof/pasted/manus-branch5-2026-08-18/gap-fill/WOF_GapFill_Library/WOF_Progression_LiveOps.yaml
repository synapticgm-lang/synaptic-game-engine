packFormatVersion: 1
fileId: WOF_Progression_LiveOps
worldId: ash_compact
publicLabel: Ash Compact Progression and Live Ops
scope: WOF-only typed data; no production code; no live-service import
engineDefaults:
  levelRange: {min: 1, max: 30}
  restedXp: {enabled: false, reason: "Rested XP is not shipped in v1."}
  xpSoftCapLevel: 30
  turnBilling: {hubStory: 1, chat: 0, auctionBrowse: 0, mail: 0, idle: 0, roundResolve: 1}
  combat: {partyMin: 1, partyMax: 5, raidSize: 10, lockstep: true, midCombatFill: false, personalLoot: true, wipeReturnsToCheckpoint: true}
  lockouts: {scope: per_character_per_boss, cadence: weekly}
  wallets: [gold, cosmetic_tokens]
  monetizationForbidden: [power_items, outcome_sales, lockout_skips, catch_rate_packs, loot_boxes, gacha, gambling]
  social: {friendsFirstFinder: true, globalChat: false, publicDmForKidMode: false, publicTradeForKidMode: false}
  productLabel: "solo / private co-op / limited online region"
  speculativeNumbersPrefix: SPEC
xpCurve:
  description: "Code-owned cumulative XP required to reach each level; level 1 starts at zero."
  table:
    - {level: 1, xpTotal: 0, xpToNext: 100}
    - {level: 2, xpTotal: 100, xpToNext: 130}
