    - {level: 11, xpTotal: 2950, xpToNext: 625}
    - {level: 12, xpTotal: 3575, xpToNext: 705}
    - {level: 13, xpTotal: 4280, xpToNext: 790}
    - {level: 14, xpTotal: 5070, xpToNext: 880}
    - {level: 15, xpTotal: 5950, xpToNext: 975}
    - {level: 16, xpTotal: 6925, xpToNext: 1075}
    - {level: 17, xpTotal: 8000, xpToNext: 1180}
    - {level: 18, xpTotal: 9180, xpToNext: 1290}
    - {level: 19, xpTotal: 10470, xpToNext: 1405}
