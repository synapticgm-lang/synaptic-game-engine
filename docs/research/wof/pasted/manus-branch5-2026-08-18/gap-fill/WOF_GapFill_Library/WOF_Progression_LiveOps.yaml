    - {level: 25, xpTotal: 20800, xpToNext: 2200}
    - {level: 26, xpTotal: 23000, xpToNext: 2350}
    - {level: 27, xpTotal: 25350, xpToNext: 2505}
    - {level: 28, xpTotal: 27855, xpToNext: 2665}
