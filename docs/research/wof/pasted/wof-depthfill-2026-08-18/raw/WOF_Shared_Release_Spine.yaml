  lockstep: true
  weeklyBossLockout: per character
  personalLoot: true
  wipe: checkpoint return
  midCombatFill: false
  permadeathV1: false
  guildBankV1: false
  globalChatV1: false
  presence: nearby count plus races only
  languageV1: English
