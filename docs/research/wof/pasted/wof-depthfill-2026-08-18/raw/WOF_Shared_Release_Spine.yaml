packFormatVersion: 1
releaseLanguage:
  default: solo / private co-op
  limitedOnline: only after limited-online-region gate
  mmo: prohibited until true MP proof
entitlements:
  ash_compact: included
  otherWorlds: buy-and-own
  themeKit: included with each entitled world
  restore: 'CODE: receipt-validated restore'
  familyPlan: 'SPEC: separate legal and platform review'
themeKitApply:
  apply: 'CODE: entitlement check then world-scoped chrome change'
  rollback: 'CODE: restore default chrome without affecting ledger'
  ageVariant: 'CODE: use approved Kid variant or omit'
wallets:
