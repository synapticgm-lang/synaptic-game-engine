    shift.'
  quest_progress: Bryn Cress checks the record and asks for the one detail that would change the outcome.
  quest_turnin: Bryn Cress marks the work complete, names who benefited, and hands over the recorded reward.
  gossip:
  - At Snow Lane, people are discussing a missing care tag.
